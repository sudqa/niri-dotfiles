exec_once=noctalia
env=QT_QPA_PLATFORMTHEME,qt6ct

# Output
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:74.973,x:0,y:0,scale:1

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=8
no_radius_when_single=0
focused_opacity=0.9
unfocused_opacity=0.9

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Layout Settings
circle_layout=scroller,dwindle
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:dwindle

# scroller
scroller_structs=8
scroller_default_proportion=0.5
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.65,0.8

# dwindle
dwindle_split_ratio=0.55
dwindle_smart_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0
dwindle_drop_simple_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
tag_num=4
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1
disable_middle_paste=0

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# mouse
mouse_natural_scrolling=0
mouse_accel_profile=0

# Appearance
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff


# Key Bindings
# apps
bind=SUPER,t,spawn,kitty
bind=SUPER+SHIFT,b,spawn,zen-browser
bind=SUPER+SHIFT,f,spawn,nautilus

# windows
bind=SUPER,q,killclient
bind=SUPER,f,togglemaximizescreen
bind=SUPER+CTRL,f,togglefullscreen
bind=SUPER,v,togglefloating
bind=SUPER,Tab,toggleoverview
bind=SUPER,Minus,resizewin,-100,0
bind=SUPER,Plus,resizewin,+100,0

# layout
bind=SUPER,n,switch_layout
bind=SUPER,r,switch_proportion_preset

# noctalia
bind=SUPER,space,spawn_shell,noctalia msg panel-toggle launcher
bind=SUPER,comma,spawn_shell,noctalia msg settings-toggle
bind=ALT,Tab,spawn_shell,noctalia msg window-switcher hold
bind=NONE,XF86AudioRaiseVolume,spawn_shell,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn_shell,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn_shell,noctalia msg volume-mute
bind=SUPER,grave,spawn_shell,noctalia msg mic-mute
bind=SUPER,F1,spawn_shell,noctalia msg screenshot-region
bind=SUPER,F2,spawn_shell,noctalia msg screenshot-fullscreen

# focus
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# move
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# mouse
axisbind=SUPER,DOWN,focusdir,right
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,exchange_client,right
axisbind=SUPER+SHIFT,UP,exchange_client,left
axis_bind_apply_timeout=150
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

source=~/.config/mango/noctalia.conf
